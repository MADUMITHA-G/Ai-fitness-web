<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-cover bg-center" 
      style="background-image: url('/static/register.jpeg');">

    <!-- Background image -->
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('fitness.jpg');"></div>
    <!-- Dark overlay with 10% opacity -->
    <div class="absolute inset-0 bg-black bg-opacity-10"></div>

    <!-- Login Card -->
    <div class="relative bg-black bg-opacity-50 backdrop-blur-md p-8 rounded-xl shadow-2xl w-full max-w-sm z-10">
        <h1 class="text-3xl font-bold text-center text-yellow-400 mb-6">Welcome Back</h1>
        <p class="text-center text-gray-300 mb-8">Login to your account to continue.</p>
        
        <!-- Jinja2 template logic -->
        {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
                <span class="block sm:inline">{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-5">
                <label for="email" class="block text-gray-200 font-medium mb-2">Email Address</label>
                <input type="email" id="email" name="email" 
                       class="w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-transparent text-white placeholder-gray-400" 
                       placeholder="Enter your email" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-200 font-medium mb-2">Password</label>
                <input type="password" id="password" name="password" 
                       class="w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-transparent text-white placeholder-gray-400" 
                       placeholder="Enter your password" required>
            </div>
            <button type="submit" 
                    class="w-full bg-yellow-400 text-black font-bold py-2 px-4 rounded-lg hover:bg-yellow-500 transition duration-300 focus:outline-none focus:ring-2 focus:ring-yellow-300 focus:ring-offset-2">
                Sign In
            </button>
        </form>
        <p class="text-center text-gray-300 mt-6">
            Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-yellow-400 hover:text-yellow-500 font-medium">Sign up here</a>
        </p>
    </div>
</body>
</html>
