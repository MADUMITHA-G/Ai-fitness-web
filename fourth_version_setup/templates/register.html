<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            color: white;
        }

        /* Background image */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('/static/register.jpeg') no-repeat center center fixed;
            background-size: cover;
            z-index: -2;
        }

        /* Dark overlay (10% opacity) */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.1);
            z-index: -1;
        }

        .container {
            background: rgba(0, 0, 0, 0.6); /* Transparent black */
            backdrop-filter: blur(6px);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        h2 {
            margin-bottom: 20px;
            color: #FFD60A; /* Yellow */
        }

        .message {
            margin-bottom: 20px;
        }
        .message.error { color: #ff4d4d; }
        .message.success { color: #4CAF50; }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #f0f0f0;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 8px;
            background: transparent;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #FFD60A; /* Yellow border on focus */
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #FFD60A;
            border: none;
            color: black;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #ffcc00;
        }

        .link {
            display: block;
            margin-top: 20px;
            color: #FFD60A;
            font-size: 14px;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        /* Ensure dropdown options readable */
        select option {
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        {% if message %}
            <p class="message {% if 'successful' in message %}success{% else %}error{% endif %}">
                {{ message }}
            </p>
        {% endif %}
        <form action="/register" method="post">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
            </div>
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter your age">
            </div>
            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" name="height" step="0.01" placeholder="Enter your height">
            </div>
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" step="0.01" placeholder="Enter your weight">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <a href="{{ url_for('login') }}" class="link">Already have an account? Login here.</a>
    </div>
</body>
</html>
