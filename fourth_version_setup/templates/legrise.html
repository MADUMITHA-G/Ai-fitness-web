<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leg Raise Workout</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    video, canvas {
      border-radius: 12px;
      border: 2px solid #ffcc00;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
    }
    #count {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 1rem;
      color: #ffcc00;
    }
    .btn {
      background: #ffcc00;
      color: #000;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 1rem;
    }
    .btn:hover {
      background: #e6b800;
    }
  </style>
</head>
<body>
  <h1 class="text-2xl font-bold text-yellow-400 mb-4">Leg Raise Tracker</h1>
  <video id="video" width="640" height="480" autoplay playsinline></video>
  <canvas id="output" width="640" height="480"></canvas>
  <div id="count">Reps: 0</div>
  <button class="btn" onclick="startTracking()">Start Workout</button>

  <script>
    let net, video, canvas, ctx;
    let count = 0;
    let legUp = false;

    async function setupCamera() {
      video = document.getElementById('video');
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      await new Promise((resolve) => video.onloadedmetadata = resolve);
      return video;
    }

    async function startTracking() {
      document.querySelector('.btn').disabled = true;
      net = await posenet.load();
      video = await setupCamera();
      video.play();

      canvas = document.getElementById('output');
      ctx = canvas.getContext('2d');
      detectPose();
    }

    async function detectPose() {
      const pose = await net.estimateSinglePose(video, { flipHorizontal: true });
      drawPose(pose);
      countLegRaise(pose);
      requestAnimationFrame(detectPose);
    }

    function drawPose(pose) {
      ctx.drawImage(video, 0, 0, 640, 480);
      pose.keypoints.forEach(k => {
        if (k.score > 0.5) {
          ctx.beginPath();
          ctx.arc(k.position.x, k.position.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = "#ffcc00";
          ctx.fill();
        }
      });
    }

    function countLegRaise(pose) {
      const leftHip = pose.keypoints.find(k => k.part === 'leftHip').position;
      const leftKnee = pose.keypoints.find(k => k.part === 'leftKnee').position;
      const leftAnkle = pose.keypoints.find(k => k.part === 'leftAnkle').position;

      const angle = Math.abs(leftHip.y - leftAnkle.y);
      // simple up/down logic
      if (angle < 100 && !legUp) {
        legUp = true;
      } else if (angle > 150 && legUp) {
        count++;
        legUp = false;
        document.getElementById('count').innerText = `Reps: ${count}`;
      }
    }
  </script>
</body>
</html>
