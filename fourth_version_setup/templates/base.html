<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Fitness Coach{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    {% block head %}{% endblock %}
    <script>
        function toggleSidebar(){
            var el = document.getElementById('sidebar');
            if(el) el.classList.toggle('hidden');
        }
    </script>
</head>
<body class="min-h-screen bg-cover bg-center" style="background-image: url('/static/register.jpeg');">
    <div class="flex min-h-screen bg-black/60">

        <aside id="sidebar" class="w-64 bg-black/80 text-yellow-300 hidden">
            <div class="p-4 text-xl font-bold">AI Fitness Coach</div>
            <nav class="flex flex-col gap-1 p-2">
              <!--  <a class="px-4 py-2 hover:bg-white/10 rounded" href="{{ url_for('home') }}">Home</a> -->
                <a class="px-4 py-2 hover:bg-white/10 rounded" href="{{ url_for('exercise') }}">Exercise</a>
                <a class="px-4 py-2 hover:bg-white/10 rounded" href="{{ url_for('profile') }}">Profile</a>
                <a class="px-4 py-2 hover:bg-white/10 rounded" href="{{ url_for('diet') }}">Diet Plan</a>
                <a class="px-4 py-2 hover:bg-white/10 rounded" href="{{ url_for('chatbot') }}">Chatbot</a>
                <a class="px-4 py-2 hover:bg-white/10 rounded" href="{{ url_for('faq') }}">FAQ</a>
                {% if session.get('name') %}
                <a class="px-4 py-2 hover:bg-white/10 rounded" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                <a class="px-4 py-2 hover:bg-white/10 rounded" href="{{ url_for('login') }}">Login</a>
                {% endif %}
            </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-1 text-gray-100">
            <header class="flex items-center justify-between p-4 bg-black/70">
                <!-- Menu Button (always visible) -->
                <button class="px-3 py-2 bg-yellow-400 text-black rounded" onclick="toggleSidebar()">Menu</button>

                <h1 class="text-lg font-semibold">{% block header %}{% endblock %}</h1>
                <div>
                    {% if session.get('name') %}
                    <span class="mr-2">Hi, {{ session.get('name') }}!</span>
                    {% endif %}
                </div>
            </header>
            <section class="p-6">
                {% block content %}{% endblock %}
            </section>
        </main>

    </div>
</body>
</html>
